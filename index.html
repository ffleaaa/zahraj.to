<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 ZAHRAJ TO</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Trebuchet MS",Arial,sans-serif;
    color:#443b55;
    min-height:100vh;
    background:
        linear-gradient(135deg,
        #ffe4f1 0%,
        #dff3ff 35%,
        #fff6bd 65%,
        #e5ffd9 100%);
    overflow-x:hidden;
}

body::before{
    content:"🎵   🎶   🎼   ♬   🥁   🎹   🎻   ⭐   🌈   ♫";
    position:fixed;
    inset:0;
    z-index:-1;
    font-size:45px;
    line-height:150px;
    letter-spacing:25px;
    opacity:.08;
    animation:bgMove 20s linear infinite;
    pointer-events:none;
}

@keyframes bgMove{
    0%{transform:translateY(0)}
    50%{transform:translateY(-80px)}
    100%{transform:translateY(0)}
}

header{
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(10px);
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 20px rgba(80,60,100,.12);
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:30px;
    font-weight:900;
    color:#8e62d9;
}

.logo span{
    color:#ff6fae;
}

.back{
    display:none;
    border:none;
    background:#e9ddff;
    color:#704db0;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
}

main{
    max-width:1200px;
    margin:auto;
    padding:35px 20px;
}

.hero{
    text-align:center;
    padding:35px 10px 45px;
}

.hero h1{
    font-size:clamp(48px,8vw,82px);
    margin:0;
    color:#7957c9;
    text-shadow:4px 4px white;
    transition:.3s;
}

.hero p{
    font-size:23px;
    font-weight:bold;
    color:#655875;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
}

.card{
    background:rgba(255,255,255,.94);
    border-radius:30px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 12px 30px rgba(80,60,100,.12);
    cursor:pointer;
    transition:.25s;
    border:3px solid transparent;
}

.card:hover{
    transform:scale(1.05) rotate(-1deg);
    box-shadow:0 18px 40px rgba(80,60,100,.2);
}
